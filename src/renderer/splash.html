<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>AI终点站 · 正在启动</title>
    <link rel="stylesheet" href="/src/startup.css" />
  </head>
  <body>
    <div class="startup-screen" role="status" aria-live="polite" aria-label="AI终点站正在启动">
      <header class="startup-titlebar">
        <div class="startup-brand">
          <img src="../../resources/app.ico" alt="" />
          <span>AI终点站</span>
        </div>
        <div class="startup-state"><span class="startup-state-dot"></span><span>正在启动</span></div>
      </header>
      <main class="startup-stage">
        <section class="startup-copy">
          <div class="startup-kicker">WORKSPACE BOOT</div>
          <h1>正在准备工作台</h1>
          <p>正在加载安全组件与本地界面</p>
          <div class="startup-progress" aria-hidden="true"><div class="startup-progress-fill"></div></div>
        </section>
        <div class="startup-workbench" aria-hidden="true">
          <aside class="startup-sidebar">
            <div class="startup-skeleton strong" style="width: 56%"></div>
            <div class="startup-skeleton" style="width: 84%"></div>
            <div class="startup-skeleton" style="width: 70%"></div>
            <div class="startup-skeleton" style="width: 78%"></div>
          </aside>
          <section class="startup-pane">
            <div class="startup-pane-header">
              <div class="startup-skeleton strong" style="width: 112px"></div>
              <div class="startup-skeleton accent" style="width: 58px"></div>
            </div>
            <div class="startup-message-flow">
              <div class="startup-skeleton strong" style="width: 38%"></div>
              <div class="startup-skeleton" style="width: 76%"></div>
              <div class="startup-skeleton" style="width: 59%"></div>
            </div>
            <div class="startup-composer"></div>
          </section>
          <aside class="startup-inspector">
            <div class="startup-skeleton strong" style="width: 62%"></div>
            <div class="startup-skeleton" style="width: 88%"></div>
            <div class="startup-skeleton accent" style="width: 44%"></div>
          </aside>
        </div>
      </main>
    </div>
  </body>
</html>
